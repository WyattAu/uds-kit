[package]
exclude = ["/target"]
name = "uds-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Timeout-aware Unix domain socket connect/read/write helpers for Tokio — transport-only, protocol-agnostic IPC plumbing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/uds-kit"
readme = "README.md"
keywords = ["unix", "socket", "uds", "timeout", "ipc"]
categories = ["os::unix-apis", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["net", "time", "io-util"] }
thiserror = "2"

[features]
default = ["std"]
std = []

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
